name: 미국 주식 정기 알림

on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'  # 평일 09:30~16:00 ET (UTC 13:30~21:00)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install yfinance requests

      - name: 미국 주식 알림 실행
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python main_us_stock.py
